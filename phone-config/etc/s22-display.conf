# Samsung Galaxy S22 (S6E3FAC) Display Extras configuration
# VRR policy: adaptive (24-120Hz PHS), adaptive_10 (10-120Hz PHS), adaptive_60, fixed, 120, 96, 60, 48, 30, 24
VRR_MODE="adaptive"

# Hardware mDNIe + IRC colour profile: vivid, natural, standard, auto, bypass, grayscale, night, outdoor
COLOUR_MODE="vivid"

# Per-channel RGB white balance gain [128..255]
WHITE_BALANCE_RGB="255 255 255"

# Hardware Night Mode colour temperature [2300..6500] K (used when COLOUR_MODE=night)
NIGHT_KELVIN="4300"

# Automatic Current Limit (ACL): 0=off, 1=8% (stock default), 2=15%, 3=30%
ACL_MODE="1"

# Automatic High Brightness Mode (HBM) in direct sunlight via STK33915 ALS: 1=enabled, 0=manual
HBM_AUTO="1"
HBM_BOOST_LUX="15000"
HBM_SUNLIGHT_LUX="40000"
HBM_EXIT_LUX="8000"

# Hardware Always-On Display (HLPM self-refresh on blank): 1=enabled, 0=disabled
AOD_ENABLED="1"
# AOD luminance in nits: 2, 10, 30, or 60
AOD_NITS="10"
# Disable AOD automatically when proximity sensor detects pocket / face-down
AOD_POCKET_GUARD="1"
